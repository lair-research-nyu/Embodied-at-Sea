<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive · Embodied at Sea</title>
<meta name="description" content="Embodied at Sea — past presentations, posters and videos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "DejaVu Sans Web";
    src: url("assets/fonts/dejavu-sans-bold.woff") format("woff");
    font-weight: 700; font-display: block;
  }
  :root {
    --ink: #13212b;
    --muted: #5b6b75;
    --line: #dbe4e8;
    --paper: #fbfcfc;
    --foam: #e8f3f6;
    --tide: #12506b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: #000; color: #fff;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 20px 56px;
    text-align: center;
    position: relative;
  }
  .back {
    position: absolute; left: 20px; top: calc(22px + env(safe-area-inset-top, 0px));
    color: rgba(255,255,255,.75); text-decoration: none; font-size: .9rem;
  }
  .back:hover { color: #fff; }
  header .site {
    margin: 26px 0 0;
    font-family: "DejaVu Sans Web", "DejaVu Sans", Verdana, sans-serif;
    font-weight: 700; letter-spacing: .02em;
    font-size: clamp(1.8rem, 5vw, 3.2rem); line-height: 1.05;
  }
  header .site a { color: inherit; text-decoration: none; }
  header h1 {
    margin: 14px 0 0;
    font-size: .8rem; font-weight: 500; letter-spacing: .3em; text-transform: uppercase;
    color: rgba(255,255,255,.7);
  }

  main { max-width: 1080px; margin: 0 auto; padding: 56px 20px 40px; }
  .event h2 {
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: clamp(1.4rem, 3vw, 2rem); line-height: 1.2;
    text-align: center; margin: 0 0 36px; text-wrap: balance;
  }

  .materials {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 700px) { .materials { grid-template-columns: 1fr; } }

  .slot {
    border: 2px dashed #b9c6cd;
    border-radius: 14px;
    background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 10px;
    padding: 24px;
    color: var(--muted);
  }
  .slot svg { width: 40px; height: 40px; color: #9aabb5; }
  .slot b { color: var(--ink); font-weight: 600; font-size: 1.05rem; }
  .slot small { font-size: .85rem; }
  .poster { aspect-ratio: 1189 / 841; }   /* A0, landscape */
  .paper {
    display: block; text-decoration: none; color: inherit;
    background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(4,19,31,.08);
    transition: transform .15s, box-shadow .15s;
  }
  .paper:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(4,19,31,.14); }
  .paper img { display: block; width: 100%; height: auto; border-bottom: 1px solid var(--line); }
  .paper-meta { display: block; padding: 14px 16px 16px; }
  .paper-meta b { display: block; font-size: .95rem; line-height: 1.35; }
  .paper-meta span { display: block; font-size: .82rem; color: var(--muted); margin-top: 4px; }
  .paper-meta .open { color: var(--tide); font-weight: 600; margin-top: 10px; }
  .soon {
    font-size: .68rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--tide); background: var(--foam);
    border-radius: 999px; padding: 3px 9px;
  }

  .video { margin-bottom: 40px; }
  .video h3, .materials h3 {
    font-size: .78rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 12px;
  }
  .video video {
    display: block; width: 100%; height: auto; aspect-ratio: 16 / 9;
    background: #000; border-radius: 12px;
    box-shadow: 0 12px 32px rgba(4,19,31,.16);
  }

  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 40px 20px 56px; }
</style>
</head>
<body>

<header>
  <a class="back" href="./">← Back</a>
  <p class="site"><a href="./">EMBODIED AT SEA</a></p>
  <h1>Archive</h1>
</header>

<main>
  <section class="event">
    <h2>IROS 2026 - Robotics One Shot Exploration (ROSE) Workshop</h2>

    <div class="video">
      <h3>Workshop video</h3>
      <video controls playsinline preload="metadata" poster="assets/archive/iros2026-rose-video-poster.jpg">
        <source src="assets/archive/iros2026-rose-video.mp4" type="video/mp4">
      </video>
    </div>

    <div class="materials">
      <div>
        <h3>Poster</h3>
        <!-- Placeholder: replace this div with <img src="assets/archive/iros2026-rose-poster.png" alt="..."> (A0, landscape). -->
        <div class="slot poster">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="1.5"/><path d="M6 8h5M6 12h5M6 16h3M14 8h4v8h-4z"/></svg>
          <b>A0 poster</b>
          <span class="soon">Coming soon</span>
        </div>
      </div>
      <div>
        <h3>Paper</h3>
        <a class="paper" href="assets/archive/iros2026-rose-paper.pdf" target="_blank" rel="noopener">
          <img src="assets/archive/iros2026-rose-paper-p1.jpg" alt="First page of the workshop paper">
          <span class="paper-meta">
            <b>Embodied At Sea: Behavior Cloning for Marine Archaeology and Wildlife Conservation</b>
            <span>Workshop paper · 3 pages · PDF</span>
            <span class="open">Open PDF →</span>
          </span>
        </a>
      </div>
    </div>
  </section>
</main>

<footer>© 2026 Embodied at Sea</footer>
</body>
</html>
